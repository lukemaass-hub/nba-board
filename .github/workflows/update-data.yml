name: Update availability data

on:
  schedule:
    # 3x a day, in UTC: 7 AM, 1 PM and 5:30 PM Eastern (during daylight time)
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Test the parsers
        run: python -m pytest -q tests

      - name: Pull from the sites and rebuild data.json
        env:
          MINUTES_CSV_URL: ${{ secrets.MINUTES_CSV_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/update_data.py --out data.json

      - name: Save data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
