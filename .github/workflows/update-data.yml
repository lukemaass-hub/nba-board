name: Update availability data

on:
  schedule:
    # 3x a day, in UTC: 7 AM, 1 PM and 5:30 PM Eastern (during daylight time)
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "30 21 * * *"
    # Every 15 minutes from 11 AM to 1 AM Eastern: refreshes only when a game tips off within
    # 45 minutes, then emails the report for games starting within 40 minutes (once per game).
    # GitHub can start these a few minutes late.
    - cron: "*/15 15-23,0-5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Test the parsers
        run: python -m pytest -q tests

      - name: Pull from the sites and rebuild data.json
        env:
          MINUTES_CSV_URL: ${{ secrets.MINUTES_CSV_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREGAME: ${{ github.event.schedule == '*/15 15-23,0-5 * * *' && '45' || '' }}
        run: python pipeline/update_data.py --out data.json ${PREGAME:+--pregame "$PREGAME"}

      - name: Email the report for games tipping off soon
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python pipeline/email_report.py --data data.json --window 40

      - name: Save data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f email_log.json ] && git add email_log.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data.json"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
