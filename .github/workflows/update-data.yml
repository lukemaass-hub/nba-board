name: Update availability data

on:
  schedule:
    # Morning refresh, 7 AM Eastern (6 AM in winter)
    - cron: "0 11 * * *"
    # Pre-game starts (user, Oct 27 2026: start ~30 minutes before the games, not throughout the day). GitHub can't
    # schedule by tip time, so a quick check runs every 30 minutes, 11 AM-11:30 PM Eastern (daylight time; 10 AM-10:30 PM
    # in winter). The "gate" job ends it in seconds unless a game tips within the next 45 minutes without its group DM;
    # then the run stays on (also for games right after), checks lineups every 3 minutes and sends.
    - cron: "0,30 15-23,0-3 * * *"
    # Mondays 9 AM Eastern: weekly minutes-changes email. GitHub schedules in UTC, so both 13:00 (daylight time) and
    # 14:00 UTC (winter, from Nov 1) run; the email step only goes ahead on the one that is 9 AM Eastern that day.
    - cron: "0 13 * * 1"
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Send a TEST Slack message for the next game now"
        type: boolean
        default: false
      weekly_email:
        description: "Send the weekly minutes-changes email now"
        type: boolean
        default: false
      test_email:
        description: "Send a TEST pre-game email for the next game now"
        type: boolean
        default: false
      test_game:
        description: "With test_email: a team in the game to send instead of the next one (e.g. NYK)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

# A code change (push) only runs the tests, in its own group: before Oct 27 2026 a push run went on to the watch step
# and held this group for hours on old code, so the timer's run sat waiting and newer runs were dropped.
concurrency:
  group: update-data${{ github.event_name == 'push' && '-push' || '' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            data.json
            email_log.json
            pipeline/gate.py
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 pipeline/gate.py data.json email_log.json

  update:
    needs: gate
    if: ${{ needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # the branch's newest commit, not the one from when the run was queued: a run that waited in line would otherwise
      # start from an old send log and send a game again (Oct 27 2026: Nets @ Celtics)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      # a failing test or a broken website never stops the Slack messages (they use the last good data);
      # the "Tell the owner" step below emails about it instead
      - name: Test the parsers
        id: tests
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Pull from the sites and rebuild data.json
        id: data
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          MINUTES_CSV_URL: ${{ secrets.MINUTES_CSV_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREGAME: ${{ github.event_name == 'schedule' && github.event.schedule != '0 11 * * *' && github.event.schedule != '0 13 * * 1' && github.event.schedule != '0 14 * * 1' && '90' || '' }}
        run: python pipeline/update_data.py --out data.json ${PREGAME:+--pregame "$PREGAME"}

      - name: Email / Slack the report for games tipping off soon
        id: send
        if: ${{ github.event_name != 'push' }}
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # DM each game to the traders in #in-play-trading's IP Trader Schedule (pipeline/slack_assign.py).
          # Switched ON Oct 26 2026 (user's request). Set the repository variable SLACK_DM_MODE to "off" or "test" to change it.
          # Nothing can be sent until the SLACK_BOT_TOKEN secret exists.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_MODE: ${{ vars.SLACK_DM_MODE || 'on' }}
          SLACK_TEST_CHANNEL: ${{ vars.SLACK_TEST_CHANNEL }}
        run: python pipeline/email_report.py --data data.json --window 25

      - name: Slack test message (only when you tick the box on "Run workflow")
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_slack }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python pipeline/email_report.py --data data.json --test-slack

      - name: Pre-game test email (only when you tick the box on "Run workflow")
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_GAME: ${{ inputs.test_game }}
        run: python pipeline/email_report.py --data data.json --test-email --game "$TEST_GAME"

      - name: Weekly minutes-changes email (Mondays, or when you tick the box)
        if: ${{ github.event.schedule == '0 13 * * 1' || github.event.schedule == '0 14 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.weekly_email) }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # only the run that is 9 AM Eastern: 13:00 UTC while on daylight time (-0400), 14:00 UTC in winter (-0500)
          off=$(TZ=America/New_York date +%z)
          if { [ "$SCHEDULE" = "0 13 * * 1" ] && [ "$off" != "-0400" ]; } || { [ "$SCHEDULE" = "0 14 * * 1" ] && [ "$off" != "-0500" ]; }; then
            echo "Not 9 AM Eastern on this run; the other Monday run sends the email."; exit 0
          fi
          python pipeline/email_report.py --data data.json --weekly

      # Stays on until every game today has its group DM: sleeps until 30 minutes before the next tip, then refreshes
      # the lineups every 3 minutes and sends as soon as they are confirmed, or at the 10-minute mark. The send log is
      # saved after every check, so nothing is ever sent twice even if the run is stopped. At most 5 hours; a later
      # slate start picks up anything left.
      - name: Keep watching until every game today has its group DM
        id: watch
        if: ${{ always() && github.event_name != 'push' && github.event.schedule != '0 11 * * *' && github.event.schedule != '0 13 * * 1' && github.event.schedule != '0 14 * * 1' }}
        continue-on-error: true
        env:
          MINUTES_CSV_URL: ${{ secrets.MINUTES_CSV_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_MODE: ${{ vars.SLACK_DM_MODE || 'on' }}
          SLACK_TEST_CHANNEL: ${{ vars.SLACK_TEST_CHANNEL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          save() {
            git add data.json; [ -f email_log.json ] && git add email_log.json
            git diff --cached --quiet && return 0
            git commit -q -m "Update data.json"
            for i in 1 2 3 4; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              sleep $((i * 5))
            done
          }
          start=$(date +%s)
          while [ $(( $(date +%s) - start )) -lt 18000 ]; do
            save; git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || true   # pick up sends logged by any other run
            w=$(python pipeline/email_report.py --data data.json --next-wait || echo -1)
            [ "$w" -lt 0 ] && break
            echo "Next check in $((w / 60)) min"
            sleep "$w"
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" || true   # tree is clean here (saved above)
            python pipeline/update_data.py --out data.json --pregame 90 > /dev/null || true
            python pipeline/email_report.py --data data.json --window 25 || true
            save
          done
          python pipeline/email_report.py --data data.json --window 25 || true   # alert if a game tipped unsent

      - name: Tell the owner if something went wrong (email, at most once an hour)
        if: ${{ steps.tests.outcome == 'failure' || steps.data.outcome == 'failure' || steps.send.outcome == 'failure' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHAT: "tests: ${{ steps.tests.outcome }}, data refresh: ${{ steps.data.outcome }}, Slack/email: ${{ steps.send.outcome }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python pipeline/email_report.py --alert "$WHAT" || true

      - name: Save data.json
        if: ${{ always() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f email_log.json ] && git add email_log.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data.json"
            # another run may have saved meanwhile: keep this run's (newer) copy. Retried, because the send log
            # (email_log.json) must be saved or the next run would send the same group DM again.
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
          fi
