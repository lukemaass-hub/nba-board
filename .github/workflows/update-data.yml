name: Update availability data

on:
  schedule:
    # 3x a day, in UTC: 7 AM, 1 PM and 5:30 PM Eastern (during daylight time)
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "30 21 * * *"
    # Every 5 minutes from 11 AM to 1 AM Eastern (was 10; Oct 26 2026): refreshes only when a game tips within
    # 90 minutes, then sends each game's Slack group DM once (lineups confirmed, or 30 min before tip).
    # GitHub sometimes starts these late or skips them, hence the frequent schedule and the catch-up rules.
    - cron: "*/5 15-23,0-5 * * *"
    # Mondays 9 AM Eastern: weekly minutes-changes email
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Send a TEST Slack message for the next game now"
        type: boolean
        default: false
      weekly_email:
        description: "Send the weekly minutes-changes email now"
        type: boolean
        default: false
      test_email:
        description: "Send a TEST pre-game email for the next game now"
        type: boolean
        default: false
      test_game:
        description: "With test_email: a team in the game to send instead of the next one (e.g. NYK)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      # a failing test or a broken website never stops the Slack messages (they use the last good data);
      # the "Tell the owner" step below emails about it instead
      - name: Test the parsers
        id: tests
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Pull from the sites and rebuild data.json
        id: data
        continue-on-error: true
        env:
          MINUTES_CSV_URL: ${{ secrets.MINUTES_CSV_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREGAME: ${{ github.event.schedule == '*/5 15-23,0-5 * * *' && '90' || '' }}
        run: python pipeline/update_data.py --out data.json ${PREGAME:+--pregame "$PREGAME"}

      - name: Email / Slack the report for games tipping off soon
        id: send
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # DM each game to the traders in #in-play-trading's IP Trader Schedule (pipeline/slack_assign.py).
          # Switched ON Oct 26 2026 (user's request). Set the repository variable SLACK_DM_MODE to "off" or "test" to change it.
          # Nothing can be sent until the SLACK_BOT_TOKEN secret exists.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_MODE: ${{ vars.SLACK_DM_MODE || 'on' }}
          SLACK_TEST_CHANNEL: ${{ vars.SLACK_TEST_CHANNEL }}
        run: python pipeline/email_report.py --data data.json --window 25

      - name: Slack test message (only when you tick the box on "Run workflow")
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_slack }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python pipeline/email_report.py --data data.json --test-slack

      - name: Pre-game test email (only when you tick the box on "Run workflow")
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_GAME: ${{ inputs.test_game }}
        run: python pipeline/email_report.py --data data.json --test-email --game "$TEST_GAME"

      - name: Weekly minutes-changes email (Mondays, or when you tick the box)
        if: ${{ github.event.schedule == '0 13 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.weekly_email) }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python pipeline/email_report.py --data data.json --weekly

      - name: Tell the owner if something went wrong (email, at most once an hour)
        if: ${{ steps.tests.outcome == 'failure' || steps.data.outcome == 'failure' || steps.send.outcome == 'failure' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHAT: "tests: ${{ steps.tests.outcome }}, data refresh: ${{ steps.data.outcome }}, Slack/email: ${{ steps.send.outcome }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python pipeline/email_report.py --alert "$WHAT" || true

      - name: Save data.json
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f email_log.json ] && git add email_log.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data.json"
            # another run may have saved meanwhile: keep this run's (newer) copy. Retried, because the send log
            # (email_log.json) must be saved or the next run would send the same group DM again.
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 5))
            done
          fi
