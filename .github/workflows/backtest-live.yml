name: Live test of the teammate-minutes model (2026-27)

# Separate from the board. Ranks healthy teammates before each game where a rotation player is out,
# then scores the picks against the real box score the next morning. Results: backtest/live/SCORECARD.md

on:
  schedule:
    # every 30 minutes, 11 AM to 12:45 AM Eastern: rank games that tip within 2 hours (picks lock at tip-off)
    - cron: "15,45 15-23,0-4 * * *"
    # 7:40 AM Eastern: download last night's box scores and score the picks
    - cron: "40 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            backtest/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt -r backtest/requirements.txt

      - name: Morning - download box scores and score last night's picks
        if: ${{ github.event.schedule == '40 11 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          python backtest/live.py update
          python backtest/live.py score

      - name: Rank games tipping soon
        if: ${{ github.event.schedule != '40 11 * * *' }}
        run: python backtest/live.py predict

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/live backtest/data/box_2026-27.csv backtest/data/games_2026-27.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Live test: update picks and scorecard"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
